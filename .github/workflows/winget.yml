# Sends a newly published release to winget (microsoft/winget-pkgs) as a pull request, by updating the
# existing jdotcollins.TesseraWall manifest to the new version and installer URL.
# Needs the repository secret WINGET_TOKEN: a classic GitHub token with the public_repo scope, from the
# account that owns the winget-pkgs fork. Without it the job says so and does nothing.
# Prereleases are skipped. Re-run by hand with Actions > winget > Run workflow and the tag.
name: winget

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag, such as v0.16.0
        required: true

permissions:
  contents: read

jobs:
  update:
    if: ${{ github.event_name == 'workflow_dispatch' || !github.event.release.prerelease }}
    runs-on: windows-latest
    steps:
      - name: Submit the new version
        shell: pwsh
        env:
          WINGET_TOKEN: ${{ secrets.WINGET_TOKEN }}
          TAG: ${{ github.event.release.tag_name || inputs.tag }}
        run: |
          if (-not $env:WINGET_TOKEN) { "WINGET_TOKEN is not set; nothing sent to winget."; exit 0 }
          if ($env:TAG -notmatch '^v\d+(\.\d+)+$') { throw "Unexpected tag '$env:TAG'" }
          $v = $env:TAG.Substring(1)
          $url = "https://github.com/$env:GITHUB_REPOSITORY/releases/download/$env:TAG/TesseraWall-setup-$v.exe"
          Invoke-WebRequest https://aka.ms/wingetcreate/latest -OutFile wingetcreate.exe -UseBasicParsing
          .\wingetcreate.exe update jdotcollins.TesseraWall --version $v --urls $url --submit --token $env:WINGET_TOKEN
          if ($LASTEXITCODE -ne 0) { throw "wingetcreate failed" }
